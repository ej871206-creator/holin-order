<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Holin 廚房 | 實驗中學專用訂單</title>
    <style>
        :root {
            --primary: #2c3e50;
            --accent: #e67e22;
            --bg: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #334155;
            --text-light: #64748b;
            --border: #e2e8f0;
        }

        body { 
            font-family: "PingFang TC", "Microsoft JhengHei", sans-serif; 
            background-color: var(--bg); color: var(--text-main);
            margin: 0; padding: 20px; display: flex; justify-content: center; line-height: 1.6;
        }

        .order-card { 
            width: 100%; max-width: 480px; background: var(--card-bg); 
            padding: 30px; border-radius: 24px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.05);
        }

        header { text-align: center; margin-bottom: 30px; }
        h2 { font-size: 1.4rem; color: var(--primary); margin: 0; }
        .subtitle { font-size: 0.85rem; color: var(--text-light); margin-top: 5px; }

        .form-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; font-size: 0.9rem; font-weight: 600; }
        
        input[type="text"], input[type="date"], select, textarea { 
            width: 100%; padding: 12px 16px; border: 1.5px solid var(--border); 
            border-radius: 14px; font-size: 16px; box-sizing: border-box; background: #fff;
        }

        /* 摺疊選單 */
        .accordion { border: 1.5px solid var(--border); border-radius: 16px; overflow: hidden; margin-bottom: 12px; }
        .accordion.active { border-color: var(--accent); }
        .accordion-header { 
            background: #fff; padding: 14px 18px; cursor: pointer; 
            display: flex; justify-content: space-between; align-items: center;
            font-size: 0.95rem; font-weight: 600;
        }
        .accordion-header .icon { font-size: 12px; transition: transform 0.3s; color: var(--accent); }
        .accordion.active .icon { transform: rotate(180deg); }
        .accordion-content { max-height: 0; overflow: hidden; transition: all 0.3s ease; background: #fafafa; }
        .accordion.active .accordion-content { max-height: 400px; padding: 15px 18px; border-top: 1px solid var(--border); }

        .option-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .option-item { display: flex; align-items: center; font-size: 14px; cursor: pointer; }
        .option-item input { margin-right: 10px; width: 18px; height: 18px; accent-color: var(--accent); }

        .total-panel { 
            margin-top: 30px; background: var(--primary); padding: 20px;
            border-radius: 20px; color: white; display: flex; 
            justify-content: space-between; align-items: center;
        }
        .total-amount { font-size: 2.2rem; font-weight: 800; }
        .total-amount span { font-size: 1.2rem; color: var(--accent); margin-right: 4px; }

        .btn-submit { 
            width: 100%; padding: 18px; background: var(--accent); color: white;
            border: none; border-radius: 16px; font-size: 1.1rem; font-weight: 700;
            cursor: pointer; margin-top: 24px; box-shadow: 0 4px 14px rgba(230, 126, 34, 0.3);
        }

        /* 彈窗 */
        .modal-overlay { 
            position: fixed; inset: 0; background: rgba(0,0,0,0.7); 
            display: none; justify-content: center; align-items: center; z-index: 100;
            backdrop-filter: blur(5px); padding: 20px;
        }
        .modal-card { background: white; width: 100%; max-width: 400px; padding: 30px; border-radius: 24px; }
        .confirm-item { display: flex; justify-content: space-between; margin-bottom: 12px; font-size: 0.95rem; }
    </style>
</head>
<body>

<div class="order-card">
    <header>
        <h2>Holin 廚房</h2>
        <div class="subtitle">實驗中學專用線上訂購系統</div>
    </header>

    <div class="form-group">
        <label>訂購日期</label>
        <input type="date" id="orderDate">
    </div>

    <div class="form-group">
        <div style="display: flex; gap: 12px;">
            <div style="flex: 1;"><label>班級</label><input type="text" id="uClass" placeholder="102"></div>
            <div style="flex: 1;"><label>姓名</label><input type="text" id="uName" placeholder="姓名"></div>
        </div>
    </div>

    <div class="form-group">
        <label>主食便當</label>
        <select id="mainDish" onchange="updateTotal()">
            <option value="none" data-price="0">-- 請選擇主餐 --</option>
            <option value="排骨便當" data-price="100">招牌排骨便當 $100</option>
            <option value="雞腿便當" data-price="120">酥炸雞腿便當 $120</option>
            <option value="控肉便當" data-price="110">古早味控肉便當 $110</option>
            <option value="蔬食便當" data-price="90">健康蔬食便當 $90</option>
        </select>
    </div>

    <label>客製化加點</label>
    
    <div class="accordion" id="acc1">
        <div class="accordion-header" onclick="toggleAcc('acc1')">主食 (加購/增量) <span class="icon">▼</span></div>
        <div class="accordion-content">
            <div class="option-grid">
                <label class="option-item"><input type="checkbox" name="side" value="單點排骨" data-price="60" onchange="updateTotal()"> 排骨 +60</label>
                <label class="option-item"><input type="checkbox" name="side" value="加飯" data-price="10" onchange="updateTotal()"> 加飯 +10</label>
            </div>
        </div>
    </div>

    <div class="accordion" id="acc2">
        <div class="accordion-header" onclick="toggleAcc('acc2')">配菜 (點心/小菜) <span class="icon">▼</span></div>
        <div class="accordion-content">
            <div class="option-grid">
                <label class="option-item"><input type="checkbox" name="side" value="滷蛋" data-price="15" onchange="updateTotal()"> 滷蛋 +15</label>
                <label class="option-item"><input type="checkbox" name="side" value="燙青菜" data-price="40" onchange="updateTotal()"> 燙青菜 +40</label>
            </div>
        </div>
    </div>

    <div class="accordion" id="acc3">
        <div class="accordion-header" onclick="toggleAcc('acc3')">飲料 (冷飲) <span class="icon">▼</span></div>
        <div class="accordion-content">
            <div class="option-grid">
                <label class="option-item"><input type="checkbox" name="side" value="紅茶" data-price="20" onchange="updateTotal()"> 紅茶 +20</label>
                <label class="option-item"><input type="checkbox" name="side" value="綠茶" data-price="20" onchange="updateTotal()"> 綠茶 +20</label>
            </div>
        </div>
    </div>

    <div class="accordion" id="acc4">
        <div class="accordion-header" onclick="toggleAcc('acc4')">客製化 (細節調整) <span class="icon">▼</span></div>
        <div class="accordion-content">
            <div class="option-grid">
                <label class="option-item"><input type="checkbox" name="side" value="飯少" data-price="0" onchange="updateTotal()"> 飯少</label>
                <label class="option-item"><input type="checkbox" name="side" value="多辣" data-price="0" onchange="updateTotal()"> 多辣</label>
            </div>
        </div>
    </div>

    <div class="form-group" style="margin-top:20px;">
        <label>備註需求</label>
        <textarea id="specialNote" rows="2" placeholder="備註您的需求..."></textarea>
    </div>

    <div class="total-panel">
        <div style="font-size: 0.85rem; opacity: 0.8;">總計金額</div>
        <div class="total-amount"><span>$</span><span id="displayTotal">0</span></div>
    </div>

    <button class="btn-submit" onclick="reviewOrder()">提交訂單</button>
</div>

<div class="modal-overlay" id="confirmModal">
    <div class="modal-card">
        <h3 style="margin-top:0; text-align:center;">🛒 訂單明細確認</h3>
        <div id="modalBody" style="margin: 20px 0;"></div>
        <div style="display: flex; gap: 12px;">
            <button onclick="closeModal()" style="flex:1; padding:12px; border:none; border-radius:12px; background:#eee; cursor:pointer;">返回修改</button>
            <button id="finalBtn" onclick="finalSubmit()" style="flex:2; padding:12px; border:none; border-radius:12px; background:var(--primary); color:white; font-weight:600; cursor:pointer;">確認送出</button>
        </div>
    </div>
</div>

<script>
    // 您的網頁應用程式網址已填入
    const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwONZ0bgCgUy3Yv6g-VCinAtyqmNaJYnqEDOWLkZanCEK4Zu05JBreAe1bRebLumvwZTg/exec";

    document.addEventListener('DOMContentLoaded', () => {
        document.getElementById('orderDate').value = new Date().toISOString().split('T')[0];
    });

    function toggleAcc(id) { document.getElementById(id).classList.toggle('active'); }

    function updateTotal() {
        const main = document.getElementById('mainDish');
        let total = parseInt(main.options[main.selectedIndex].dataset.price || 0);
        document.querySelectorAll('input[name="side"]:checked').forEach(i => total += parseInt(i.dataset.price || 0));
        document.getElementById('displayTotal').innerText = total;
    }

    function reviewOrder() {
        const d = document.getElementById('orderDate').value;
        const c = document.getElementById('uClass').value;
        const n = document.getElementById('uName').value;
        const m = document.getElementById('mainDish').value;
        if(!c || !n || m === "none") return alert("資訊未填寫完整喔！");

        let sides = [];
        document.querySelectorAll('input[name="side"]:checked').forEach(i => sides.push(i.value));
        
        document.getElementById('modalBody').innerHTML = `
            <div class="confirm-item"><span>日期</span><b>${d}</b></div>
            <div class="confirm-item"><span>訂購人</span><b>${c} ${n}</b></div>
            <div class="confirm-item"><span>主餐</span><b>${m}</b></div>
            <div class="confirm-item"><span>加點</span><b>${sides.join(', ') || '無'}</b></div>
            <div class="confirm-item" style="border-top:1px solid #eee; padding-top:10px; margin-top:10px;">
                <span>總額</span><b style="color:var(--accent); font-size:1.4rem;">$${document.getElementById('displayTotal').innerText}</b>
            </div>
        `;
        document.getElementById('confirmModal').style.display = 'flex';
    }

    function closeModal() { document.getElementById('confirmModal').style.display = 'none'; }

    async function finalSubmit() {
        const btn = document.getElementById('finalBtn');
        btn.innerText = "正在送出...";
        btn.disabled = true;

        let selectedSides = [];
        document.querySelectorAll('input[name="side"]:checked').forEach(i => selectedSides.push(i.value));

        const orderData = {
            date: document.getElementById('orderDate').value,
            uClass: document.getElementById('uClass').value,
            uName: document.getElementById('uName').value,
            main: document.getElementById('mainDish').value,
            sides: selectedSides.join(', '),
            note: document.getElementById('specialNote').value,
            price: document.getElementById('displayTotal').innerText
        };

        try {
            // 發送資料至 Google Sheets
            await fetch(GOOGLE_SCRIPT_URL, {
                method: "POST",
                mode: "no-cors",
                body: JSON.stringify(orderData),
                headers: { "Content-Type": "application/json" }
            });

            alert("🎉 訂單已成功傳送！\n祝您用餐愉快！");
            location.reload(); 
        } catch (error) {
            alert("傳送失敗，請聯繫店家或檢查網路。");
            btn.innerText = "確認送出";
            btn.disabled = false;
        }
    }
</script>

</body>
</html>
